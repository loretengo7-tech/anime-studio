name: Build desktop app (.exe)

# Builds AnimeStudio Desktop for Windows from source/ and publishes the
# installer + portable .exe as a GitHub Release (tag desktop-v<version>).
# Runs on every push that touches source/, or manually:
# Actions → "Build desktop app (.exe)" → Run workflow.

on:
  push:
    branches: [main]
    paths: ['source/**', '.github/workflows/build-desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install
        working-directory: source
        run: npm ci --no-audit --no-fund
      - name: Static build (root base path for the desktop shell)
        working-directory: source
        run: bash scripts/build-static.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: source/dist-static
          retention-days: 3

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: source/desktop/app
      - name: Install desktop deps (Electron + ffmpeg for Windows)
        working-directory: source/desktop
        run: npm install --no-audit --no-fund
      - name: Bundle neural AI tools (Real-ESRGAN + RIFE, ncnn-vulkan official builds)
        working-directory: source/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force ai, ai\realesrgan\models, ai\rife | Out-Null
          Invoke-WebRequest https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip -OutFile esr.zip
          Expand-Archive esr.zip -DestinationPath esr
          Copy-Item esr\realesrgan-ncnn-vulkan.exe, esr\vcomp140.dll ai\realesrgan\
          Copy-Item esr\models\realesr-animevideov3-x2.*, esr\models\realesr-animevideov3-x3.*, esr\models\realesr-animevideov3-x4.*, esr\models\realesrgan-x4plus-anime.* ai\realesrgan\models\
          Invoke-WebRequest https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-windows.zip -OutFile rife.zip
          Expand-Archive rife.zip -DestinationPath rife
          $r = 'rife\rife-ncnn-vulkan-20221029-windows'
          Copy-Item "$r\rife-ncnn-vulkan.exe" ai\rife\
          Get-ChildItem $r -Filter *.dll | Copy-Item -Destination ai\rife\
          Copy-Item "$r\rife-v4.6" ai\rife\ -Recurse
          Copy-Item "$r\LICENSE" ai\rife\LICENSE.txt
          Remove-Item esr, rife, esr.zip, rife.zip -Recurse -Force
          Get-ChildItem ai -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build the OpenFX host (MSVC) + test plug-in
        working-directory: source/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force ofxhost\build | Out-Null
          cl /nologo /O2 /EHsc /std:c++17 /MT /W3 /I ofxhost\include ofxhost\ofxhost.cpp /Fo:ofxhost\build\ /Fe:ofxhost\build\ofxhost.exe
          Remove-Item ofxhost\build\*.obj -ErrorAction SilentlyContinue
          $b = "$env:RUNNER_TEMP\ofxtest\asTestFx.ofx.bundle\Contents\Win64"
          New-Item -ItemType Directory -Force $b | Out-Null
          cl /nologo /O2 /EHsc /std:c++17 /MT /LD /I ofxhost\include ofxhost\testplugin\asTestFx.cpp /Fo:"$env:RUNNER_TEMP\" /Fe:"$b\asTestFx.ofx"
          if (-not (Test-Path "$b\asTestFx.ofx")) { throw 'test plug-in not built' }
          $out = "DESCRIBE`t$env:RUNNER_TEMP\ofxtest\asTestFx.ofx.bundle`nQUIT`n" | .\ofxhost\build\ofxhost.exe
          $out
          if (-not ($out -match 'PLUGIN\s+0\s+com.animestudio.testvignette')) { throw 'ofxhost could not describe the test plug-in' }
      - name: Package (NSIS installer + portable exe)
        working-directory: source/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never
      - name: Smoke test — installed app (Setup.exe) and portable must both open
        working-directory: source/desktop
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*Setup.exe | Select-Object -First 1
          $inst = Start-Process $setup.FullName -ArgumentList '/S','/D=C:\ASInstall' -PassThru -Wait
          Write-Host "installer exit code: $($inst.ExitCode)"
          # the installer can hand off to a child process: wait for the files to land
          for ($i = 0; $i -lt 90 -and -not (Test-Path 'C:\ASInstall\AnimeStudio.exe'); $i++) { Start-Sleep -Seconds 2 }
          Get-Process | Where-Object { $_.ProcessName -match 'Setup|Un_A|AnimeStudio' } | Format-Table ProcessName, Id -AutoSize
          Get-ChildItem C:\ASInstall -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          if (-not (Test-Path 'C:\ASInstall\AnimeStudio.exe')) {
            $alt = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter AnimeStudio.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($alt) { Write-Host "installed to $($alt.FullName) instead"; New-Item -ItemType Junction -Path C:\ASInstall -Target $alt.DirectoryName -Force | Out-Null }
          }
          $fails = @()
          $env:AS_OFX_DIR = "$env:RUNNER_TEMP\ofxtest"
          foreach ($t in @(@{ name = 'installed'; exe = 'C:\ASInstall\AnimeStudio.exe' }, @{ name = 'portable'; exe = (Get-ChildItem dist\*portable.exe | Select-Object -First 1).FullName })) {
            $env:AS_SMOKE = "$env:RUNNER_TEMP\smoke-$($t.name).png"
            $p = Start-Process $t.exe -PassThru
            if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Get-Process AnimeStudio -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if (Test-Path $env:AS_SMOKE) { Write-Host "OK  $($t.name) rendered" } else { Write-Host "FAIL $($t.name)"; $fails += $t.name }
            $j = Get-Content "$env:AS_SMOKE.json" -Raw -ErrorAction SilentlyContinue
            Write-Host "smoke info: $j"
            # OpenFX: the bundled host must load the test plug-in and invert 200,100,50 -> 55,155,205
            if ($j -match '"render":"55,155,205,255"') { Write-Host "OK  $($t.name) OpenFX render" } else { Write-Host "FAIL $($t.name) OpenFX"; $fails += "$($t.name)-ofx" }
            Start-Sleep -Seconds 2
          }
          foreach ($exe in 'C:\ASInstall\resources\ofx\ofxhost.exe', 'C:\ASInstall\resources\ai\realesrgan\realesrgan-ncnn-vulkan.exe', 'C:\ASInstall\resources\ai\rife\rife-ncnn-vulkan.exe', 'C:\ASInstall\resources\ai\rife\rife-v4.6\flownet.bin') {
            if (Test-Path $exe) { Write-Host "OK  bundled $exe" } else { Write-Host "FAIL missing $exe"; $fails += 'ai' }
          }
          Write-Host '--- main.log ---'
          Get-Content "$env:APPDATA\AnimeStudio\logs\main.log" -ErrorAction SilentlyContinue
          if ($fails.Count) { throw "smoke failed: $fails" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke-*.png
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./source/desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeStudio-windows
          path: |
            source/desktop/dist/*.exe
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.v.outputs.version }}
          name: AnimeStudio Desktop ${{ steps.v.outputs.version }} (Windows)
          make_latest: true
          body: |
            **AnimeStudio Desktop para Windows** — el mismo editor, compilado como app.

            - `AnimeStudio-${{ steps.v.outputs.version }}-Setup.exe` → instalador (recomendado)
            - `AnimeStudio-${{ steps.v.outputs.version }}-portable.exe` → sin instalar, doble clic y listo

            Diferencias con la web: GPU forzada, sin límites de pestaña, más RAM para el RAM Preview,
            ffmpeg incluido (abre MKV/HEVC/AVI/ProRes y crea proxies rápidos automáticamente).
            Plug-ins OpenFX (.ofx.bundle — p. ej. las versiones OFX de Sapphire, RSMB, Neat Video): Plugins › OpenFX.
            IA neuronal incluida en el Video Lab: Real-ESRGAN (AnimeVideo v3 / x4plus Anime) y RIFE 4.6
            (requieren una GPU con Vulkan: NVIDIA / AMD / Intel con drivers actualizados).

            Windows puede mostrar "SmartScreen" porque el .exe no está firmado: *Más información → Ejecutar de todas formas*.

            Si algo no abre: el registro está en `%APPDATA%\AnimeStudio\logs\main.log`.
            Si la GPU falla, la app se reinicia sola en modo GPU seguro (o ejecútala con `--safe-gpu`).
          files: source/desktop/dist/*.exe
